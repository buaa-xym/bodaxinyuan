name: bdaxinyuan-house-monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitor
        env:
          BD_TOKEN: ${{ secrets.BD_TOKEN }}
          SENDKEY: ${{ secrets.SENDKEY }}
        run: python bdaxinyuan_monitor.py --once
      - name: Commit state
        run: |
          git config user.name monitor-bot
          git config user.email monitor-bot@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push
